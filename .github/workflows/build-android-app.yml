# Builds the Grihobazar Android app in the cloud, so no Android Studio and no
# Android SDK are needed on your own computer.
#
# HOW TO RUN IT
#   GitHub → Actions tab → "Build Android app" → "Run workflow"
#   When it finishes, open the run and download the files under "Artifacts".
#
# WHAT YOU GET
#   grihobazar-debug-apk  — install this on your phone to test. Always built.
#   grihobazar-release-aab — upload this to Play Console. Only built once the
#                            four signing secrets below exist.
#
# TO GET THE RELEASE AAB, add these under
# Settings → Secrets and variables → Actions → New repository secret:
#   KEYSTORE_BASE64      the whole contents of keystore-base64.txt (one long line)
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            the key alias
#   KEY_PASSWORD         the key password
# Without them the release job is skipped and the debug APK still builds.

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'GrihobazarApp/**'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: GrihobazarApp

jobs:
  debug-apk:
    name: Debug APK (installable for testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('GrihobazarApp/**/*.gradle', 'GrihobazarApp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grihobazar-debug-apk
          path: GrihobazarApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-aab:
    name: Signed release AAB (for Play Console)
    runs-on: ubuntu-latest
    # Skipped automatically until the signing secrets are added.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether signing secrets are present
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set, so the release AAB was skipped. The debug APK still built."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.signing.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          GB_STORE_FILE: ${{ runner.temp }}/upload.jks
          GB_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grihobazar-release-aab
          path: GrihobazarApp/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore from the runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
